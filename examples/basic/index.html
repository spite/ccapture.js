<head>
  <meta charset="utf-8" />
  <title>CCapture — Basic 2D</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: #111; display: grid; place-content: center; }
    canvas { background: #fff; border: 1px solid #333; max-width: 100vw; }
  </style>
</head>
<body>
  <canvas id="canvas" width="960" height="540"></canvas>

  <script type="module">
    import { createCaptureUI } from "../CaptureUI.js";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Draw one frame at warped time `t` (seconds). Busy enough to show blur.
    function render(t) {
      const { width: w, height: h } = canvas;
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h);
      ctx.save();
      ctx.translate(w / 2, h / 2);
      for (let i = 0; i < 12; i++) {
        const a = t * 2 + (i / 12) * Math.PI * 2;
        ctx.fillStyle = `hsl(${(i / 12) * 360}, 80%, 50%)`;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 180, Math.sin(a) * 180, 22, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.rotate(t * Math.PI);
      ctx.fillStyle = "#111";
      ctx.fillRect(-220, -8, 440, 16);
      ctx.restore();
    }

    createCaptureUI({ canvas, render, title: "Basic 2D" });
  </script>
</body>
