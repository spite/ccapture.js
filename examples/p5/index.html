<head>
  <meta charset="utf-8" />
  <title>CCapture — p5.js</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: #0a0c14; display: grid; place-content: center; }
    canvas { border: 1px solid #333; max-width: 100vw; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>
</head>
<body>
  <script type="module">
    import { createCaptureUI } from "../CaptureUI.js";

    new p5((s) => {
      // An ordinary p5 sketch — nothing capture-specific in setup/draw.
      s.setup = () => {
        const c = s.createCanvas(720, 720);
        s.colorMode(s.HSB, 360, 100, 100, 1);
        s.noStroke();
        s.noLoop(); // CaptureUI drives the frames (via redraw), for preview and capture

        // Same shared panel as every other example.
        createCaptureUI({ canvas: c.elt, render: () => s.redraw(), title: "p5.js" });
      };

      s.draw = () => {
        const t = s.millis() / 1000; // warped while capturing → deterministic
        s.background(230, 30, 8);
        s.translate(s.width / 2, s.height / 2);
        const N = 160;
        for (let i = 0; i < N; i++) {
          const a = (i / N) * s.TWO_PI + t * 0.35;
          const r = 250 + 70 * s.sin(t * 1.4 + i * 0.18);
          s.fill((i * 2.2 + t * 40) % 360, 80, 100);
          s.circle(s.cos(a) * r, s.sin(a) * r, 7 + 6 * s.sin(t * 3 + i));
        }
      };
    });
  </script>
</body>
